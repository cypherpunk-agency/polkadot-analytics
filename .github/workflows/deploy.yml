name: deploy

# ═══════════════════════════════════════════════════════════════════════════════════════════
#  THE DEPLOY JOB IS FULLY WIRED BUT GATED OFF. IT WILL BE SKIPPED UNTIL ENABLED.
#
#  The image job below runs on every push to main: it builds and publishes
#  ghcr.io/cypherpunk-agency/polkadot-analytics:<sha> and :latest. Publishing an image is
#  harmless — nothing pulls it until a deploy runs.
#
#  The `deploy` job carries every value infra supplied (see "SUPPLIED BY INFRA" below) but
#  stays deliberately unable to run until somebody sets the repository variable
#  DEPLOY_ENABLED to the string 'true'. It is gated with `if:`, which SKIPS the job rather
#  than failing it, so main stays green in the meantime. Flip it only after (a) infra posts
#  GO on the bridge — they hold the deploy until the VM's image pull is confirmed — and
#  (b) the GCP_DEPLOY_SSH_KEY Actions secret exists; the preflight step refuses to proceed
#  without it, because a half-configured deploy that runs is worse than one that does not.
# ═══════════════════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit once this is live.
  workflow_dispatch:

# Minimal and explicit. Nothing is inherited, nothing is implied:
#   contents: read     check out the source
#   packages: write    push to GHCR as GITHUB_TOKEN
#   id-token: write    mint the short-lived OIDC token that Workload Identity Federation
#                      exchanges for GCP credentials. This is why there is no GCP_SA_KEY
#                      secret in this repository and why there must never be one: a
#                      downloaded service-account key is a long-lived credential sitting in
#                      a settings page, and the whole point of WIF is not having it.
permissions:
  contents: read
  packages: write
  id-token: write

# Never cancel a deploy that is already touching the VM — a half-applied deploy is the one
# state nobody can reason about. Queue instead.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cypherpunk-agency/polkadot-analytics

jobs:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  image:
    name: build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The digest, not the tag, is what the deploy pins to. `:latest` is a moving pointer and
      # `:<sha>` can in principle be re-pushed; a digest cannot mean two things.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out
        # Pinned to a commit SHA, not a tag: a tag is a mutable pointer, and whatever it points
        # at runs with this workflow's token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GITHUB_TOKEN, scoped by the `packages: write` permission above. No PAT, no secret to
      # rotate, and the credential dies with the job.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "BUILD_STAMP=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

          # RepoDigests is only populated after a successful push, so this doubles as proof the
          # push landed.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${digest}"

  # ─────────────────────────────────────────────────────────────────────────────────────────
  deploy:
    name: deploy to the VM
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # ╔═══════════════════════════════════════════════════════════════════════════════════╗
    # ║ THE GUARD. While the repository variable DEPLOY_ENABLED is anything other than    ║
    # ║ the string 'true', this job is SKIPPED — not failed. That distinction is the       ║
    # ║ whole design: an unconfigured deploy must not turn main red, because a red main    ║
    # ║ that everybody knows to ignore is worse than no check at all.                      ║
    # ║                                                                                    ║
    # ║ To enable: Settings → Secrets and variables → Actions → Variables, and only        ║
    # ║ AFTER the four values under "OWED BY INFRA" below actually exist.                  ║
    # ╚═══════════════════════════════════════════════════════════════════════════════════╝
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      # ═══════════════════════════════════════════════════════════════════════════════════
      #  SUPPLIED BY INFRA (agent bridge, 2026-08-19) — every value this job was owed is a
      #  reviewed literal in this file now. None is confidential, so the "this repo has no
      #  secrets" claim stays literally true:
      #
      #   1. Workload Identity provider + service account — in the auth step below. The
      #      pool's attribute condition binds to this repository only, and the service
      #      account holds exactly roles/compute.viewer + roles/iap.tunnelResourceAccessor —
      #      deliberately NOT instanceAdmin, so it cannot write project metadata, which is
      #      what keeps this workflow from being able to mint itself root on the VM.
      #
      #   2. Instance and zone — web-server / europe-west1-b, in the restart step below.
      #
      #   3. THE PINNED PRIVILEGED COMMAND — sudo /usr/local/bin/deploy-service, inline in
      #      the restart step, NOT read from a repository variable, and that is deliberate:
      #      a command injected from a variable is arbitrary remote code execution for
      #      anyone who can edit repository settings. Pinned here, it went through code
      #      review like everything else.
      #
      #  The ONE Actions secret this job reads is GCP_DEPLOY_SSH_KEY — the private half of
      #  the per-repo ed25519 deploy key infra generated and registers in project metadata
      #  (fingerprint SHA256:P7x9dWPeLny1fMxD93gy4I/WSjwKiR1PAw8LMbNFlL4). It is an SSH key
      #  scoped to this one service's deploys, independently revocable by deleting a single
      #  metadata entry; it is NOT a GCP credential.
      #
      #  There is still deliberately NO GCP_SA_KEY. Keyless OIDC only. If anyone proposes
      #  adding a downloaded service-account JSON to this repository's secrets, that is the
      #  thing this whole workflow was written to avoid.
      # ═══════════════════════════════════════════════════════════════════════════════════

      # Belt and braces for the guard above. `if:` stops the job while nobody has flipped the
      # flag; this stops it if somebody flips the flag before the values exist. Failing here
      # with a readable message beats failing three steps later inside gcloud.
      - name: Preflight — refuse to deploy with placeholder infra values
        env:
          # Compared, never interpolated: these are 'true'/'false', not the secrets' values.
          HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          HAS_DEPLOY_KEY: ${{ secrets.GCP_DEPLOY_SSH_KEY != '' }}
        run: |
          set -uo pipefail

          # 'true' since 2026-08-20, flipped in the SAME change that pinned the real remote
          # command in the last step of this file. It is a literal in the workflow rather than
          # a repository variable so that "the deploy command is real now" was a reviewed code
          # change. Checked first, so a misconfigured run never authenticates to GCP or opens
          # an SSH session at all.
          PINNED_COMMAND_SUPPLIED=true
          if [ "$PINNED_COMMAND_SUPPLIED" != 'true' ]; then
            echo '::error::The pinned privileged deploy command is still a TODO(infra) placeholder.'
            echo '::error::Nothing was deployed. See the OWED BY INFRA block in .github/workflows/deploy.yml.'
            exit 1
          fi

          # The infra values are reviewed literals in this file now (see SUPPLIED BY INFRA
          # below); the one thing that must still exist in settings is the private half of
          # the deploy key infra registered.
          if [ "$HAS_DEPLOY_KEY" != 'true' ]; then
            echo '::error::The GCP_DEPLOY_SSH_KEY Actions secret is not set. It is the private'
            echo '::error::half of the per-repo deploy key infra registered in project metadata;'
            echo '::error::until it exists, DEPLOY_ENABLED must stay off.'
            exit 1
          fi
          # A downloaded key would defeat the point of the OIDC setup. Catch it loudly.
          if [ "$HAS_SA_KEY" = 'true' ]; then
            echo '::error::A GCP_SA_KEY secret exists. This repository uses keyless OIDC on purpose.'
            echo '::error::Delete the secret and rotate the underlying service-account key.'
            exit 1
          fi
          echo 'Preflight passed.'

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keyless. This exchanges the job's short-lived OIDC token for a GCP access token that
      # expires in minutes. Nothing long-lived is stored anywhere.
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # Supplied by infra over the bridge (2026-08-19). Repo-scoped on their side: the
          # pool's attribute condition binds to this repository, so any other repo, fork or
          # org gets a 403 at token exchange. ("cyberphunk" is the real project ID, sic.)
          workload_identity_provider: 'projects/422633553646/locations/global/workloadIdentityPools/github/providers/github-oidc'
          service_account: 'deploy-polkadot-analytics@cyberphunk-agency.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # ╔═══════════════════════════════════════════════════════════════════════════════════╗
      # ║  EVERY `gcloud compute ssh` AND `gcloud compute scp` BELOW MUST PASS               ║
      # ║  `--ssh-key-file`. THIS IS NOT STYLE.                                              ║
      # ║                                                                                    ║
      # ║  Without it, gcloud looks for ~/.ssh/google_compute_engine, does not find one on a  ║
      # ║  fresh ephemeral runner, GENERATES A NEW KEYPAIR, and pushes the public half into   ║
      # ║  PROJECT-WIDE metadata. Project metadata keys grant root-equivalent access to       ║
      # ║  EVERY instance in the project, they never expire, and nothing removes them.        ║
      # ║  One per deploy. Twenty-five had accumulated before they were pruned — twenty-five  ║
      # ║  standing root keys whose private halves were destroyed with the runners that made  ║
      # ║  them, which means nobody could even tell which were still live.                    ║
      # ║                                                                                    ║
      # ║  `--ssh-key-file` points gcloud at the key infra registered for this repo — the    ║
      # ║  only key that CAN authenticate, since the SA cannot push a new one to metadata.   ║
      # ║                                                                                    ║
      # ║  TODO(infra): the durable fix is OS Login (`enable-oslogin=TRUE` in project or      ║
      # ║  instance metadata). With OS Login on, keys land in the service account's login     ║
      # ║  profile with a TTL instead of in project metadata, access is governed by IAM       ║
      # ║  roles, and this failure mode stops being possible rather than being remembered.    ║
      # ║  Ask infra to enable it and to add `--tunnel-through-iap` so the VM needs no public  ║
      # ║  SSH exposure at all.                                                              ║
      # ╚═══════════════════════════════════════════════════════════════════════════════════╝
      - name: Install the registered deploy key
        env:
          DEPLOY_KEY: ${{ secrets.GCP_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          # A key generated fresh on this runner could never authenticate here: the service
          # account deliberately lacks metadata write, so gcloud could not register a new
          # public half even if asked — that omission is a feature, see the box above. This
          # is the per-repo key infra generated and registered (fingerprint
          # SHA256:P7x9dWPeLny1fMxD93gy4I/WSjwKiR1PAw8LMbNFlL4); its private half exists
          # only as the Actions secret. Named so it can never collide with the file gcloud
          # would have created on its own.
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/gha_deploy"
          chmod 600 "$HOME/.ssh/gha_deploy"
          # Derive the public half next to it — this doubles as the fail-fast on a truncated
          # or mangled secret. gcloud requires BOTH files: with the .pub missing it declares
          # the pair broken and offers to regenerate it, which `--quiet` rightly aborts
          # (run 32351410319 failed exactly there). Deriving from the private key cannot
          # drift from what infra registered.
          ssh-keygen -y -f "$HOME/.ssh/gha_deploy" > "$HOME/.ssh/gha_deploy.pub"
          chmod 644 "$HOME/.ssh/gha_deploy.pub"

      - name: Restart the service on the pinned image digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          INSTANCE: web-server      # the shared e2-small — supplied by infra over the bridge
          ZONE: europe-west1-b
        run: |
          set -euo pipefail

          # The pinned privileged command, supplied by infra over the bridge (2026-08-19).
          # `deploy-service` validates the digest format, refuses a service that is not in
          # compose, pulls, recreates, and waits on Docker health. It is handed the DIGEST,
          # never a tag: `:latest` deploys whatever the pointer means that second (which is
          # how their hq service crash-looped on 2026-07-16), a tag can be re-pushed, and
          # "which build is actually on the box" has to be answerable. It stays inline in
          # this file rather than coming from a repository variable on purpose — see the
          # SUPPLIED BY INFRA note above.
          #
          # RepoDigests yields `ghcr.io/...@sha256:<hex>`; the remote command takes the bare
          # `sha256:<hex>`. Validated down to the character class before it is allowed near
          # a shell line, so the interpolation below cannot carry anything but a digest.
          PINNED="${DIGEST#*@}"
          if ! printf '%s' "$PINNED" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Image digest '${DIGEST}' did not yield a sha256:<64-hex> reference."
            exit 1
          fi
          REMOTE="sudo /usr/local/bin/deploy-service polkadot-analytics ${PINNED}"

          # `--ssh-key-file` — read the box above before touching this line. It is the
          # difference between one ephemeral key and a permanent root-equivalent key added to
          # project metadata on every single run.
          #
          # Once infra enables OS Login and IAP, add `--tunnel-through-iap` to this invocation
          # and close public SSH on the instance. It is left out rather than commented into the
          # command, because a half-uncommented continuation line is its own kind of outage.
          gcloud compute ssh "$INSTANCE" \
            --zone "$ZONE" \
            --ssh-key-file="$HOME/.ssh/gha_deploy" \
            --quiet \
            --command "$REMOTE"

      # The deploy is not done when the command returns; it is done when the service answers.
      # /api/health also reports `build`, so this proves the NEW image is what is serving —
      # a restart that silently kept the old container would still pass a plain 200 check.
      - name: Verify the deployed service
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            body=$(curl -fsS --max-time 5 https://analytics.cypherpunk.agency/api/health || true)
            if [ -n "$body" ]; then
              echo "$body"
              echo "$body" | grep -q "\"build\":\"${GITHUB_SHA}\"" && exit 0
            fi
            sleep 5
          done
          echo "::error::analytics.cypherpunk.agency is not serving build ${GITHUB_SHA} after 150s."
          exit 1
